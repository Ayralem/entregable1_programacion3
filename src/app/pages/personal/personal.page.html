<div class="profile-section">
  <!-- Avatar decorativo con glow -->
  <div class="avatar-wrapper">
    <div class="avatar-glow"></div>
    <div class="avatar-image">
      <img src="assets/img/cat.jpg" alt="Foto de perfil" />
    </div>
  </div>

  <h2 class="profile-name">{{ personalInfo.name }}</h2>
  <p class="profile-role">{{ personalInfo.role }}</p>
  <p class="profile-location">
    <ion-icon name="location-outline"></ion-icon>
    {{ personalInfo.location }}
  </p>

  <!-- Stats horizontal -->
  <div class="stats-row">
    @for (stat of stats; track stat.label) {
      <div class="stat-item">
        <span class="stat-value prism-text">{{ stat.value }}</span>
        <span class="stat-label">{{ stat.label }}</span>
      </div>
    }
  </div>

  <!-- Bio card -->
  <div class="glass-card info-card">
    <div class="card-accent"></div>
    <div class="card-body">
      <h3>Sobre mí</h3>
      <p>{{ personalInfo.bio }}</p>
    </div>
  </div>

  <!-- Contacto card -->
  <div class="glass-card info-card">
    <div class="card-accent accent-purple"></div>
    <div class="card-body">
      <h3>Contacto</h3>
      <div class="contact-row">
        <ion-icon name="mail-outline"></ion-icon>
        <span>{{ personalInfo.email }}</span>
      </div>
      <div class="contact-row">
        <ion-icon name="call-outline"></ion-icon>
        <span>{{ personalInfo.phone }}</span>
      </div>
    </div>
  </div>
</div>
